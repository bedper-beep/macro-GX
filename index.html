<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MACRO GX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading">LOADING...</div>

<div class="screen" id="intro">
  <h1>MACRO GX</h1>
  <div class="sub">— TACTICAL FPS —</div>
</div>

<div class="screen hidden" id="menu">
  <h2>MACRO GX</h2>
  <button class="btn big green" id="btnPlay">▶ PLAY</button>
  <button class="btn" id="btnSettingsMenu">⚙ SETTINGS</button>
  <button class="btn" id="btnInfoMenu">ⓘ ABOUT</button>
</div>

<div class="screen hidden" id="lobby">
  <div class="panel">
    <h2>LOBBY</h2>
    <div class="row"><span>NAME</span><input id="playerName" maxlength="14" value="PLAYER"></div>
    <div class="row"><span>MODE</span>
      <select id="gameMode">
        <option value="1v1">1 vs 1</option>
        <option value="tdm" selected>Team Deathmatch</option>
        <option value="br">Battle Royale</option>
      </select>
    </div>
    <div class="row"><span>ENEMIES</span><span id="enemyCount">4</span></div>
    <div class="row"><span>ROOM CODE</span><span id="roomCode" style="color:#22c55e;">----</span></div>
    <div style="text-align:center; margin-top:20px;">
      <button class="btn green" id="btnStart">▶ START MATCH</button>
      <button class="btn" id="btnSettingsLobby">⚙ SETTINGS</button>
      <button class="btn" id="btnBackMenu">← BACK</button>
    </div>
  </div>
</div>

<div id="settings" style="display:none;">
  <div class="panel">
    <h3>SETTINGS</h3>
    <div class="keyRow"><span>MOVE FORWARD</span><button class="keyBtn" data-action="forward">KeyW</button></div>
    <div class="keyRow"><span>MOVE BACK</span><button class="keyBtn" data-action="back">KeyS</button></div>
    <div class="keyRow"><span>MOVE LEFT</span><button class="keyBtn" data-action="left">KeyA</button></div>
    <div class="keyRow"><span>MOVE RIGHT</span><button class="keyBtn" data-action="right">KeyD</button></div>
    <div class="keyRow"><span>RELOAD</span><button class="keyBtn" data-action="reload">KeyR</button></div>
    <div class="keyRow"><span>SCOPE</span><button class="keyBtn" data-action="scope">ShiftLeft</button></div>
    <div class="keyRow"><span>SPRINT</span><button class="keyBtn" data-action="sprint">ShiftRight</button></div>
    <div class="keyRow"><span>JUMP</span><button class="keyBtn" data-action="jump">Space</button></div>
    <div class="keyRow"><span>WEAPON 1</span><button class="keyBtn" data-action="w1">Digit1</button></div>
    <div class="keyRow"><span>WEAPON 2</span><button class="keyBtn" data-action="w2">Digit2</button></div>
    <div class="keyRow"><span>WEAPON 3</span><button class="keyBtn" data-action="w3">Digit3</button></div>
    <div class="sliderRow">SENSITIVITY <span id="sensVal" style="float:right;">1.0</span>
      <input type="range" id="sensSlider" min="0.2" max="3" step="0.1" value="1">
    </div>
    <div class="sliderRow">VOLUME <span id="volVal" style="float:right;">60%</span>
      <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.6">
    </div>
    <div style="text-align:center; margin-top:18px;">
      <button class="btn green" id="btnSettingsClose">✓ DONE</button>
      <button class="btn" id="btnResetSettings">↺ RESET</button>
    </div>
  </div>
</div>

<div id="crosshair"></div>
<div id="scope"></div>
<div id="hitMarker"></div>
<div id="dmgFlash"></div>

<div id="hud">
  <div>HP <span id="hpText">100</span><span class="bar"><span id="hpBar" class="barFill" style="width:100%"></span></span></div>
</div>
<div id="hudRight">
  <div><span id="ammoText">12 / 12</span></div>
  <div style="margin-top:6px; color:#5b7a99;"><span id="weaponName">PISTOL</span></div>
</div>
<div id="hudTop">
  WAVE <span id="waveText">1</span> · KILLS <span id="killText">0</span> · SCORE <span id="scoreText">0</span>
</div>
<div id="killLog"></div>

<div id="mobile">
  <div id="mJoy"><div id="mKnob"></div></div>
  <div id="mFire">FIRE</div>
  <div id="mReload">RELOAD</div>
  <div id="mScope">SCOPE</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module" src="script.js"></script>

</body>
</html>
